app = "tombstone"
primary_region = "iad"

[build]
  dockerfile = "Dockerfile"

[env]
  PORT = "8099"

[http_service]
  internal_port = 8099
  force_https = true
  # Keep one machine warm. A judge may click the link days after the deadline, and a cold
  # machine that has been scaled to zero is the single most common way a hackathon demo
  # appears broken.
  auto_stop_machines = false
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  memory = "1gb"
  cpu_kind = "shared"
  cpus = 1
