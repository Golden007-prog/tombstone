name: keep the demo awake

# A free Hugging Face Space sleeps when idle, and a judge who clicks a sleeping one waits through
# a cold boot -- measured at about ten seconds here, longer if the image has to be pulled -- or
# sees Hugging Face's "this Space is sleeping" screen first. That is a bad first impression of a
# product whose whole pitch is that you can click it and it answers.
#
# So this pings it. The URL is read from the repository's homepage field, which deploy_hf.sh sets
# the moment the Space exists, so there is nothing to configure and nothing to keep in step: no
# homepage means no deploy yet, and the job says so and exits clean rather than failing a repo
# that simply has not been deployed.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Find the deployed Space, if there is one
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh api "repos/${{ github.repository }}" --jq '.homepage // ""')"
          case "$url" in
            *hf.space*|*huggingface.co/spaces*)
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "found $url" ;;
            *)
              echo "no Space in the homepage field yet — nothing to keep awake" ;;
          esac

      - name: Wake it and check it actually answers
        if: steps.find.outputs.url != ''
        run: |
          url="${{ steps.find.outputs.url }}"
          # A sleeping Space can take a while to come back, so this is patient rather than strict.
          for attempt in $(seq 1 10); do
            body="$(curl -sf -m 60 "$url/api/health" || true)"
            if printf '%s' "$body" | grep -q '"up"'; then
              echo "awake: $body"
              # Serving is not the same as working. One real traversal, every time.
              #
              # The shape is NOT asserted to be ANSWERED_WITH_PATH. This job asks the same
              # question every six hours, /api/tool records what it answers, and a repeat of a
              # question whose citations still resolve comes back ANSWERED_FROM_MEMORY. Demanding
              # the first shape would have passed on the first ping after deployment and failed on
              # every one after it -- a red cross on the repository every six hours, starting
              # exactly when people are looking at it. The invariant that matters is that it
              # ANSWERED, with rows, from the graph.
              # The `question` field is what memory is keyed by, and every one of these pings
              # writes an (:Answer) node on the live Space. Without it the entry is labelled from
              # the tool name, so a judge who clicks the recall chip reads "asked 9x" about a
              # question they never asked and cannot tell a robot from a visitor. Naming the
              # prober makes the memory self-explanatory, and keeps the assertion as strong.
              curl -sf -m 90 -X POST "$url/api/tool" \
                -H 'content-type: application/json' \
                -d '{"tool":"sole_approver_risk","args":{},"question":"keep-warm probe (GitHub Actions, every 6h): which areas have exactly one approver?"}' \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("shape"); r=d.get("rows") or []; print(f"answered: {s} with {len(r)} rows"); sys.exit(0 if s in ("ANSWERED_WITH_PATH","ANSWERED_FROM_MEMORY") and r else f"not a real answer: {s}, {len(r)} rows")'
              exit 0
            fi
            echo "attempt $attempt: still waking…"
            sleep 30
          done
          echo "the Space did not wake within five minutes"
          exit 1
