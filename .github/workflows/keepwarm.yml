name: keep the demo awake

# A free Hugging Face Space sleeps when idle, and a judge who clicks a sleeping one waits through
# a cold boot -- measured at about ten seconds here, longer if the image has to be pulled -- or
# sees Hugging Face's "this Space is sleeping" screen first. That is a bad first impression of a
# product whose whole pitch is that you can click it and it answers.
#
# So this pings it. The URL is read from the repository's homepage field, which deploy_hf.sh sets
# the moment the Space exists, so there is nothing to configure and nothing to keep in step: no
# homepage means no deploy yet, and the job says so and exits clean rather than failing a repo
# that simply has not been deployed.

on:
  schedule:
    - cron: "0 */6 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      # Matches the three hosts this project is actually configured to deploy to, not just the
      # one it planned to. Hugging Face refused a Docker Space on a free account with a 402 on
      # 17 Oct, so Render is the likely home -- and this job matched `*hf.space*` only, meaning it
      # would have sat quietly doing nothing for the entire judging period on the path that was
      # taken. Anchored on the host, not on a substring of the whole URL, so a repository homepage
      # that merely mentions one of these words does not get probed.
      #
      # Naming what this job can and cannot do, per host. On Hugging Face a free CPU Space idles
      # for 48 hours before sleeping, so six-hourly really does keep it warm. On Render's free
      # plan a web service spins down after 15 MINUTES, which no cron on this schedule can hold
      # open -- and hammering a free tier every fourteen minutes to try is both unreliable on
      # GitHub's scheduler and not a thing to do to someone else's free compute. So on Render
      # this is a HEALTH CHECK, not a keep-warm: it proves the deployment still answers with real
      # rows from the graph, and the ~1 minute cold start stays a disclosed property of that
      # plan rather than something this job pretends to solve.
      - name: Find the deployment, if there is one
        id: find
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          url="$(gh api "repos/${{ github.repository }}" --jq '.homepage // ""')"
          host="$(printf '%s' "$url" | sed -E 's#^[a-z]+://##; s#/.*$##')"
          case "$host" in
            *.hf.space|huggingface.co|*.onrender.com|*.fly.dev)
              echo "url=$url" >> "$GITHUB_OUTPUT"
              echo "found $url (host $host)" ;;
            "")
              echo "the repository homepage is empty — nothing deployed yet, nothing to check" ;;
            *)
              echo "homepage is $host, which is not one of the configured deploy targets"
              echo "(hf.space, huggingface.co, onrender.com, fly.dev) — not probing it" ;;
          esac

      - name: Wake it and check it actually answers
        if: steps.find.outputs.url != ''
        run: |
          url="${{ steps.find.outputs.url }}"
          # A sleeping Space can take a while to come back, so this is patient rather than strict.
          for attempt in $(seq 1 10); do
            body="$(curl -sf -m 60 "$url/api/health" || true)"
            if printf '%s' "$body" | grep -q '"up"'; then
              echo "awake: $body"
              # Serving is not the same as working. One real traversal, every time.
              #
              # The shape is NOT asserted to be ANSWERED_WITH_PATH. This job asks the same
              # question every six hours, /api/tool records what it answers, and a repeat of a
              # question whose citations still resolve comes back ANSWERED_FROM_MEMORY. Demanding
              # the first shape would have passed on the first ping after deployment and failed on
              # every one after it -- a red cross on the repository every six hours, starting
              # exactly when people are looking at it. The invariant that matters is that it
              # ANSWERED, with rows, from the graph.
              # The `question` field is what memory is keyed by, and every one of these pings
              # writes an (:Answer) node on the live Space. Without it the entry is labelled from
              # the tool name, so a judge who clicks the recall chip reads "asked 9x" about a
              # question they never asked and cannot tell a robot from a visitor. Naming the
              # prober makes the memory self-explanatory, and keeps the assertion as strong.
              curl -sf -m 90 -X POST "$url/api/tool" \
                -H 'content-type: application/json' \
                -d '{"tool":"sole_approver_risk","args":{},"question":"keep-warm probe (GitHub Actions, every 6h): which areas have exactly one approver?"}' \
              | python3 -c 'import json,sys; d=json.load(sys.stdin); s=d.get("shape"); r=d.get("rows") or []; print(f"answered: {s} with {len(r)} rows"); sys.exit(0 if s in ("ANSWERED_WITH_PATH","ANSWERED_FROM_MEMORY") and r else f"not a real answer: {s}, {len(r)} rows")'
              exit 0
            fi
            echo "attempt $attempt: still waking…"
            sleep 30
          done
          echo "the Space did not wake within five minutes"
          exit 1

      # The demo was killed by the platform for exceeding its memory limit on 17 Oct, and the
      # first I knew of it was an email. Every memory figure in this repository had been measured
      # on a laptop; none had ever been read off the instance. /api/health now reports its own
      # RSS and its cgroup limit, so this reads them from the running demo every six hours.
      #
      # It REPORTS always and FAILS only above 90% of the limit, which is the point where a kill
      # is imminent rather than merely worth knowing. A tighter gate would put a red cross on the
      # repository during judging over a number that moves with traffic; a report with no gate at
      # all is how the last one went unnoticed. Missing fields are a skip, not a failure: an
      # instance deployed before this existed, or a host with no cgroup, is not a problem.
      - name: Read the live instance's own memory envelope
        if: steps.find.outputs.url != ''
        run: |
          curl -sf -m 60 "${{ steps.find.outputs.url }}/api/health" \
          | python3 -c 'import json,sys; m=(json.load(sys.stdin) or {}).get("memory") or {}; u=m.get("container_mb"); l=m.get("limit_mb"); print(f"the instance reports: {m}"); sys.exit(0) if not (u and l) else None; p=u/l*100; print(f"{u:.0f} MiB of {l:.0f} MiB -- {p:.0f}% used, {l-u:.0f} MiB of headroom"); sys.exit(f"the live demo is at {p:.0f}% of its memory limit; a kill is imminent" if p >= 90 else 0)'
