name: verify

# Everything this project claims should be checkable without cloning it. This workflow runs the
# same three commands the README tells you to run, against a real FalkorDB, on every push.
#
# The drift job exists because of a bug I hit three times: the README's Cypher catalogue is
# GENERATED from tools.py, and I edited the queries while leaving the generated block stale. A
# judge reading "these are generated from source, so they are the queries that actually run"
# would have been reading something that no longer ran.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      falkordb:
        # Pinned, not :latest -- 6.x drops algo.AStar/CCH and carries crash and
        # silently-wrong-result bugs. See docs/GROUND-TRUTH.md.
        image: falkordb/falkordb:v4.22.1
        ports: ["6380:6379"]
        options: >-
          --health-cmd "redis-cli PING"
          --health-interval 5s --health-timeout 3s --health-retries 10

    env:
      FALKORDB_HOST: localhost
      FALKORDB_PORT: 6380
      PYTHONPATH: src

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Raise the baked-in limits
        # The image ships RESULTSET_SIZE 10000 (silently TRUNCATES larger returns with no error),
        # TIMEOUT 1000 (kills any algorithm call over a second) and MAX_QUEUED_QUERIES 25.
        # Set through the Python client rather than redis-cli, which the runner does not have.
        run: |
          python - <<'PY'
          from graphkit.ingest import connect
          c = connect().connection
          for k, v in (("RESULTSET_SIZE", 1000000), ("MAX_QUEUED_QUERIES", 4096)):
              try:
                  c.execute_command("GRAPH.CONFIG", "SET", k, v)
                  print(f"  {k} = {v}")
              except Exception as e:
                  print(f"  {k}: {e}")
          PY

      - name: Seed from the committed snapshot
        run: |
          python - <<'PY'
          import time
          from tombstone.snapshot import load
          from tombstone.build import build
          t0 = time.perf_counter()
          st = build(load())
          print(f"seeded in {time.perf_counter()-t0:.2f}s: {st}")
          assert st["Kep"] > 600, st
          assert st["parse_failures"] == 0, f"corpus parse failures: {st['parse_failures']}"
          PY

      - name: Tests
        run: pytest tests/ -q

      - name: Every README claim, re-checked against the live graph
        run: python verify_claims.py

      - name: The action's own claims, re-checked against a live run
        run: python verify_action.py

      - name: The README's memory claims, re-checked against a live run
        run: python verify_memory.py

      - name: Retrieval eval + negative controls
        run: python eval_retrieval.py

      - name: Graph vs a text baseline on the same corpus
        run: python eval_graph_vs_text.py

      - name: Serve the app for the UI check
        run: |
          # The graph is already seeded above, so this serves the same instance the checks use.
          # No API key is set here on purpose: that is the hosted configuration, which is the one
          # whose rendering matters most.
          nohup python -m uvicorn tombstone.server:app --host 127.0.0.1 --port 8099 \
            > /tmp/serve.log 2>&1 &
          for _ in $(seq 1 40); do
            curl -sf -m 3 http://localhost:8099/api/health >/dev/null && break
            sleep 2
          done
          curl -sf -m 5 http://localhost:8099/api/health || { cat /tmp/serve.log; exit 1; }

      - name: Every rendered answer state, checked for visible-but-empty panels
        run: python scripts_check_ui.py

      - name: FalkorDB vs networkx on the real graph (cross-checked, timings reported)
        run: |
          pip install -q networkx scipy
          python bench_vs_networkx.py

      - name: GRAPH.COPY still carries the whole graph, and report the timing
        run: python bench_copy.py

      - name: The premise measurement still matches what the README claims
        run: python measure_repeat_rejections.py

      - name: The demo script narrates what the app actually returns
        run: python scripts_check_demo_facts.py

      - name: The demo script can actually be spoken in 3 minutes
        run: python scripts_check_demo_timing.py

      - name: README's stated test count matches reality
        run: |
          python - <<'PY'
          import re, subprocess, sys
          readme = open("README.md").read()
          m = re.search(r"#\s*(\d+)\s+invariant tests", readme)
          if not m:
              sys.exit("README no longer states a test count next to the pytest command.")
          claimed = int(m.group(1))
          out = subprocess.run([sys.executable, "-m", "pytest", "tests/", "--collect-only", "-q"],
                               capture_output=True, text=True).stdout
          c = re.search(r"(\d+) tests? collected", out)
          if not c:
              sys.exit("could not read the collected test count from pytest:\n" + out[-800:])
          actual = int(c.group(1))
          if claimed != actual:
              sys.exit(f"README says {claimed} invariant tests; pytest collects {actual}. "
                       "The README has been wrong about this before -- update the comment next "
                       "to the pytest command in the Quickstart.")
          print(f"README and pytest agree: {actual} tests")
          PY

      - name: README Cypher catalogue has not drifted from the source
        run: |
          python scripts_gen_readme_cypher.py > /tmp/generated.md
          python - <<'PY'
          import re, sys
          readme = open("README.md").read()
          gen = open("/tmp/generated.md").read()
          start = readme.index("## The Cypher this product depends on")
          m = re.search(r"^## ", readme[start + 10:], flags=re.M)
          end = start + 10 + m.start() if m else len(readme)
          if gen.strip() not in readme[start:end].strip():
              sys.exit(
                  "README's Cypher catalogue is stale.\n"
                  "The README claims these queries are generated from src/tombstone/tools.py.\n"
                  "Re-run: python scripts_gen_readme_cypher.py and splice the output back in."
              )
          print("catalogue matches source")
          PY

  # The README promises `git clone && pip install && ./run.sh`. That promise was unchecked for 45
  # commits, and when it was finally run on a machine that already had FalkorDB, it FAILED --
  # compose fixes `container_name: falkordb`, so anyone with that container already present (a
  # second checkout, or anyone who has used FalkorDB before) got a hard stop on the first command
  # the README gives them. This job reproduces that machine deliberately: it starts a container
  # called falkordb FIRST, then runs the quickstart, and requires it to reuse rather than collide.
  quickstart:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Put a container called falkordb in the way, as a judge's machine would have
        run: |
          docker run -d --name falkordb -p 6380:6379 \
            -e FALKORDB_ARGS="RESULTSET_SIZE 1000000 TIMEOUT 0" \
            falkordb/falkordb:v4.22.1
          for _ in $(seq 1 40); do
            docker exec falkordb redis-cli PING 2>/dev/null | grep -q PONG && break
            sleep 2
          done
          docker ps --format '  {{.Names}} {{.Status}}'

      - name: The quickstart, exactly as the README writes it
        run: |
          python3 -m venv .venv && ./.venv/bin/pip install -q -r requirements.txt
          nohup ./run.sh > /tmp/run.log 2>&1 &
          for _ in $(seq 1 60); do
            curl -sf -m 3 http://localhost:8099/api/health >/dev/null && break
            sleep 2
          done
          curl -sf -m 5 http://localhost:8099/api/health || { cat /tmp/run.log; exit 1; }
          grep -q "already serving on 6380" /tmp/run.log \
            || { echo "run.sh did not reuse the existing FalkorDB"; cat /tmp/run.log; exit 1; }
          echo "  reused the existing instance, as it should"

      - name: It serves and answers, not just starts
        run: |
          python - <<'PY'
          import json, sys, urllib.request

          def post(path, body):
              req = urllib.request.Request(
                  f"http://localhost:8099{path}", method="POST",
                  data=json.dumps(body).encode(),
                  headers={"content-type": "application/json"})
              return json.load(urllib.request.urlopen(req, timeout=120))

          answered = {"ANSWERED_WITH_PATH", "ANSWERED_FROM_MEMORY"}
          got = post("/api/tool", {"tool": "draft_owners_patch", "args": {}})
          print("  draft_owners_patch ->", got["shape"])
          assert got["shape"] in answered, got

          typed = post("/api/ask", {"question": "which areas have exactly one approver?"})
          print("  typed, keyless     ->", typed["shape"], typed.get("routed_to"))
          assert typed["shape"] in answered, typed
          assert typed.get("headline"), "a typed answer came back with no headline"
          PY
